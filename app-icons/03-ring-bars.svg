<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="ringTitle ringDesc">
  <title id="ringTitle">Speednet — Anillo y barras</title>
  <desc id="ringDesc">Anillo de progreso con tres barras ascendentes de velocidad.</desc>

  <defs>
    <linearGradient id="ringBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <clipPath id="ringClip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ringClip)">
    <rect width="512" height="512" fill="url(#ringBg)"/>
    <ellipse cx="190" cy="105" rx="240" ry="160" fill="#FFFFFF" opacity="0.09"/>
  </g>

  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4"/>

  <!-- pista -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="34"/>
  <!-- progreso -->
  <path d="M150 362 A150 150 0 1 1 362 362" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>

  <!-- barras de velocidad -->
  <g fill="#FDE047">
    <rect x="196" y="300" width="30" height="64" rx="15"/>
    <rect x="242" y="268" width="30" height="96" rx="15"/>
    <rect x="288" y="232" width="30" height="132" rx="15"/>
  </g>
</svg>
