<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="signalTitle signalDesc">
  <title id="signalTitle">Speednet — Señal y rayo</title>
  <desc id="signalDesc">Ondas de señal y un rayo de velocidad.</desc>

  <defs>
    <linearGradient id="signalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <clipPath id="signalClip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#signalClip)">
    <rect width="512" height="512" fill="url(#signalBg)"/>
    <ellipse cx="180" cy="110" rx="230" ry="160" fill="#FFFFFF" opacity="0.08"/>
  </g>

  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4"/>

  <!-- ondas de señal -->
  <g fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" opacity="0.95">
    <path d="M116.8 292.4 A170 170 0 0 1 395.2 292.4"/>
    <path d="M157.7 321.1 A120 120 0 0 1 354.3 321.1"/>
    <path d="M198.7 349.8 A70 70 0 0 1 313.3 349.8"/>
  </g>
  <circle cx="256" cy="390" r="20" fill="#FFFFFF"/>

  <!-- rayo -->
  <path d="M365 168 L296 288 L342 288 L318 372 L404 250 L357 250 Z"
        fill="#FDE047" stroke="#0E7490" stroke-width="10" stroke-linejoin="round"/>
</svg>
